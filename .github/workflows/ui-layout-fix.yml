name: ui-layout-fix
on:
  push:
    branches: [refactor/beui-platform-ui]
    paths: [.github/workflows/ui-layout-fix.yml]
permissions:
  contents: write
concurrency:
  group: ui-layout-fix
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'asharca/ToolPlane'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply only checksum-verified UI source fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/beui-platform-ui
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          after={"src/components/dashboard/knowledge/WorkspaceKnowledge.tsx":"b3bc715176776b1eb1c9fc68850667bd5ca939337c742d596a777a033da5ac6c","src/components/dashboard/work/WorkspaceWork.tsx":"b34e7e69c154b4e34514f1c9f3d7df6326ea9e4173d148b2d8be90f061467ab0","src/components/dashboard/work/A2AWorkbench.tsx":"11147d45ddca673c1252e599b680500bfd9ffffd0c2b54c40eaef28ed466f5a9","src/components/dashboard/market/MarketDetailShell.tsx":"b98e56bfba61576c80e13c644a5d88a107133cfc4663155c914512df775286a4","src/app/app/[workspace]/market/mcp/[serverSlug]/page.tsx":"d159ccacc30bc5183869c85c9e55ceeef2eee1e105c8a09ba54d65dc1612875e","src/components/ui/beui/components/motion/input.tsx":"84e485c23fb565fb7617924ec3585b0399198614233d4a493a0cbb328fd62ded","src/components/ui/Controls.tsx":"2c46d7afb2841f78d95a51927f1bfa3e98cade9b77c1459e706baab9aeb38734","src/components/ui/beui/provenance.json":"ec2679b389c114e8beebd6506cfea6e39fa5d460a4ca35bb3d1f18fe768aec96","tests/unit/beui-native-contracts.test.tsx":"b8f9992d9deaf3d72aca8e6fbb24941e5a83ad406205f91cd5f896415095a93b","tests/unit/beui-architecture.test.ts":"fc59792ebdf55403b4f2d38c0b442a7281952b923160b8075584954f1a870654","tests/browser/platform-ui.mjs":"79dcec8195cb76ef0f4c5cb454c84b44176090eead6272a209d19ecdc24d9dd7"}
          def change(path,f):
              p=Path(path);old=p.read_text();new=f(old);assert new!=old,path;p.write_text(new)
          landmarks=['src/components/dashboard/knowledge/WorkspaceKnowledge.tsx','src/components/dashboard/work/WorkspaceWork.tsx','src/components/dashboard/work/A2AWorkbench.tsx','src/components/dashboard/market/MarketDetailShell.tsx','src/app/app/[workspace]/market/mcp/[serverSlug]/page.tsx']
          for file in landmarks:
              change(file,lambda s:s.replace('<main ', '<div ').replace('</main>', '</div>'))
          def registry(s):
              old='''            "peer h-full w-full bg-transparent text-base leading-6 text-foreground caret-foreground outline-none",
                      "placeholder:text-muted-foreground/60",
                      leftIcon ? "pl-10" : "pl-3.5",
                      rightSlot || success ? "pr-10" : "pr-3.5",'''
              new='''            "peer w-full outline-none",
                      !nativeLayout && "h-full bg-transparent text-base leading-6 text-foreground caret-foreground placeholder:text-muted-foreground/60",
                      !nativeLayout && (leftIcon ? "pl-10" : "pl-3.5"),
                      !nativeLayout && (rightSlot || success ? "pr-10" : "pr-3.5"),'''
              assert old in s;return s.replace(old,new)
          change('src/components/ui/beui/components/motion/input.tsx',registry)
          change('src/components/ui/Controls.tsx',lambda s:s.replace("'h-10 rounded-xl border border-input bg-background px-3.5 text-sm focus-visible:ring-2 focus-visible:ring-ring/30'","'rounded-xl focus-visible:ring-2 focus-visible:ring-ring/30'"))
          def provenance(s):
              d=json.loads(s);entry=next(x for x in d['files'] if x['path']=='components/motion/input.tsx');entry['adapted'].append('nativeLayout leaves sizing and icon padding to the form adapter CSS');return json.dumps(d,indent=2)+'\n'
          change('src/components/ui/beui/provenance.json',provenance)
          def tests(s):
              target="  it('keeps controlled numeric input and textarea values editable', async () => {"
              extra='''  it('does not override native icon padding or compact sizes with standalone registry utilities', () => {
              render(<><Input aria-label="Search with icon" className="ui-input-icon" controlSize="sm" /><SearchInput label="Clearable search" value="query" onClear={() => {}} /></>);
              const icon = screen.getByLabelText('Search with icon');
              expect(icon).toHaveClass('ui-input-icon', 'ui-input-sm');
              for (const input of [icon, screen.getByRole('searchbox')]) {
                for (const token of ['px-3.5', 'pl-3.5', 'pr-3.5', 'h-full', 'h-10']) expect(input).not.toHaveClass(token);
              }
              expect(screen.getByRole('searchbox')).toHaveClass('tp-search-input__control');
            });
          '''
              assert target in s;return s.replace(target,extra+target)
          change('tests/unit/beui-native-contracts.test.tsx',tests)
          def arch(s):
              target="  it('records the requested registry and preserves reduced-motion and forced-color handling', () => {"
              paths=json.dumps(landmarks)
              extra=f'''  it('leaves the main landmark with the dashboard host, not nested feature panes', () => {{
              for (const file of {paths}) {{
                const ast = ts.createSourceFile(file, readFileSync(file, 'utf8'), ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
                const landmarks: string[] = [];
                const visit = (node: ts.Node) => {{
                  if ((ts.isJsxOpeningElement(node) || ts.isJsxSelfClosingElement(node)) && node.tagName.getText(ast) === 'main') landmarks.push(file);
                  ts.forEachChild(node, visit);
                }};
                visit(ast);
                expect(landmarks).toEqual([]);
              }}
            }});
          '''
              assert target in s;return s.replace(target,extra+target)
          change('tests/unit/beui-architecture.test.ts',arch)
          def browser(s):
              s=s.replace("    await noPageOverflow(page); await page.screenshot({ path: path.join(output, 'desktop-workspace.png') });",'''    await noPageOverflow(page);
              const field = page.getByPlaceholder('Search toolkits...');
              const geometry = await field.evaluate(el => {
                const icon = el.parentElement.querySelector('svg');
                return { textStart: el.getBoundingClientRect().left + parseFloat(getComputedStyle(el).paddingLeft), iconEnd: icon.getBoundingClientRect().right };
              });
              assert.ok(geometry.textStart >= geometry.iconEnd + 4, 'Search text must not overlap its icon.');
              await page.screenshot({ path: path.join(output, 'desktop-workspace.png') });''')
              s=s.replace("    assert.ok(await page.getByRole('dialog').innerText());",'''    const dialog = page.getByRole('dialog');
              await dialog.getByRole('heading', { name: 'Internal collaboration', exact: true }).waitFor();
              assert.equal(await dialog.getByRole('button', { name: 'Enable internal A2A', exact: true }).isDisabled(), true);
              await dialog.getByText('Configure a model provider, model and exactly one exclusive networked Docker sandbox first.', { exact: true }).waitFor();''')
              s=s.replace("      await page.getByRole('main').waitFor(); await noPageOverflow(page);",'''      await page.getByRole('main').waitFor();
                assert.equal(await page.getByRole('main').count(), 1, `${segment} must have exactly one main landmark`);
                await noPageOverflow(page);''')
              s=s.replace("  await context.close();",'''  await check('light mobile theme keeps the workspace surface and fields visible', async () => {
              await page.evaluate(() => localStorage.setItem('theme', 'light')); await page.reload();
              await page.locator('html.light').waitFor(); await noPageOverflow(page);
              await page.screenshot({ path: path.join(output, 'mobile-light.png') });
              assert.equal(errors.length, 0, `Unhandled browser errors: ${errors.join('; ')}`);
            });
            await context.close();''')
              return s
          change('tests/browser/platform-ui.mjs',browser)
          for name,digest in after.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run(['git','add','--',*after],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(after)
          print('Verified 11 UI paths; no backend or workflow changes in the patch.')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve icon padding and a single main landmark across workspace panes'
          git push origin HEAD:refs/heads/refactor/beui-platform-ui
