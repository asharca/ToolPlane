name: ui-layout-fix
on:
  push:
    branches: [refactor/beui-platform-ui]
    paths: [.github/workflows/ui-layout-fix.yml]
permissions:
  contents: write
concurrency:
  group: ui-layout-fix
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'asharca/ToolPlane'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply only checksum-verified UI source fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/beui-platform-ui
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          before={"src/components/dashboard/knowledge/WorkspaceKnowledge.tsx":"1d43c562c1b0d08fb478593860971fd521e92f1fe1a786bd4fdc28ed8e394241","src/components/dashboard/work/WorkspaceWork.tsx":"39ecad4bb7a2635e9623352d30c6e2e8731b6637f6d7ace64e71a883ff6db698","src/components/dashboard/work/A2AWorkbench.tsx":"c4fc8f18f721c5dc59ba6e295e777b5c6720710b39f92521ed5ad4e400d33d21","src/components/dashboard/market/MarketDetailShell.tsx":"1c13c255b0a7fe613a4b64f57d81c493f0a3f87b956a6a4f23e8a9432d54364f","src/app/app/[workspace]/market/mcp/[serverSlug]/page.tsx":"aeb2b11cd1e896bff8e7a99799d4ccbf69b047c672c1d7a94c99683bb2a71379","src/components/ui/beui/components/motion/input.tsx":"5c6ea6953ecc2802f7e7514059ac65f8d371021c56c580ea34903ea1d62c306d","src/components/ui/Controls.tsx":"3f2165ca91af43af944297d30f0bca8bc55be77bab81f9e350d7f7430265ecd5","src/components/ui/beui/provenance.json":"652e1fcd148b5de04386f761ed1d4324a1d96cbf3858c9b61a67ddebbccb95e1","tests/unit/beui-native-contracts.test.tsx":"8c1fdcd394c968527dd4caa4ef03d7fed141f6d1ef241476ae73f39eb99906e4","tests/unit/beui-architecture.test.ts":"8b38cef0f296be09e64b1f3e022dbb9b888e62639a5f533f79d90297a05edf40","tests/browser/platform-ui.mjs":"38d8bbf06838a3030cb3cbe30cb6f6b55e279cd5ade1118e155ddf03ee13ac56"}
          after={"src/components/dashboard/knowledge/WorkspaceKnowledge.tsx":"b3bc715176776b1eb1c9fc68850667bd5ca939337c742d596a777a033da5ac6c","src/components/dashboard/work/WorkspaceWork.tsx":"b34e7e69c154b4e34514f1c9f3d7df6326ea9e4173d148b2d8be90f061467ab0","src/components/dashboard/work/A2AWorkbench.tsx":"11147d45ddca673c1252e599b680500bfd9ffffd0c2b54c40eaef28ed466f5a9","src/components/dashboard/market/MarketDetailShell.tsx":"b98e56bfba61576c80e13c644a5d88a107133cfc4663155c914512df775286a4","src/app/app/[workspace]/market/mcp/[serverSlug]/page.tsx":"d159ccacc30bc5183869c85c9e55ceeef2eee1e105c8a09ba54d65dc1612875e","src/components/ui/beui/components/motion/input.tsx":"84e485c23fb565fb7617924ec3585b0399198614233d4a493a0cbb328fd62ded","src/components/ui/Controls.tsx":"2c46d7afb2841f78d95a51927f1bfa3e98cade9b77c1459e706baab9aeb38734","src/components/ui/beui/provenance.json":"ec2679b389c114e8beebd6506cfea6e39fa5d460a4ca35bb3d1f18fe768aec96","tests/unit/beui-native-contracts.test.tsx":"b8f9992d9deaf3d72aca8e6fbb24941e5a83ad406205f91cd5f896415095a93b","tests/unit/beui-architecture.test.ts":"fc59792ebdf55403b4f2d38c0b442a7281952b923160b8075584954f1a870654","tests/browser/platform-ui.mjs":"79dcec8195cb76ef0f4c5cb454c84b44176090eead6272a209d19ecdc24d9dd7"}
          patch=''
          for name,digest in before.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          data=gzip.decompress(base64.b64decode(patch))
          subprocess.run(['git','apply','--check','--whitespace=error','-'],input=data,check=True)
          subprocess.run(['git','apply','--index','--whitespace=error','-'],input=data,check=True)
          for name,digest in after.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(after)
          print('Verified 11 UI paths; no backend or workflow changes in the patch.')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve icon padding and a single main landmark across workspace panes'
          git push origin HEAD:refs/heads/refactor/beui-platform-ui
