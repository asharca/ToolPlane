name: runtime-package-diagnostics
on:
  push:
    branches: [feat/a2a-console-onboarding]
    paths: [.github/workflows/runtime-package-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract failed artifact verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/runtime-diagnostics
          gh run view 35872307672 --repo asharca/ToolPlane --job 107219263284 --log-failed > /tmp/runtime-failed.log 2>&1 || true
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('/tmp/runtime-failed.log').read_text(errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          lines = text.splitlines()
          bounded = '\n'.join(line[:1000] for line in lines[-100:])[-20000:]
          pathlib.Path('/tmp/runtime-diagnostics/failure.txt').write_text(bounded + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-failure-bounded
          path: /tmp/runtime-diagnostics/failure.txt
          retention-days: 1
