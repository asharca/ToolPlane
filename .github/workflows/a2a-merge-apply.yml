name: a2a-merge-apply
on:
  push:
    branches: [feat/a2a-console-onboarding]
    paths: ['.a2a-merge-patch.*', '.github/workflows/a2a-merge-apply.yml']
permissions:
  contents: write
concurrency:
  group: a2a-merge-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'asharca/ToolPlane' && github.ref == 'refs/heads/feat/a2a-console-onboarding'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed patch and exact conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          def run(*args, **kwargs):
              return subprocess.run(args, check=True, text=True, **kwargs)
          root = pathlib.Path.cwd()
          compressed = b''.join((root / f'.a2a-merge-patch.{i}').read_bytes() for i in range(1, 6))
          assert hashlib.sha256(compressed).hexdigest() == '882d12c3a22a860844abd4eddd29b504ec9130f845f243dcc8e3b39691592c47'
          patch = lzma.decompress(compressed)
          assert len(patch) == 175969
          target = pathlib.Path('/tmp/a2a-ingress-reviewed.patch')
          target.write_bytes(patch)
          run('git', 'apply', '--check', '--unidiff-zero', str(target))
          run('git', 'apply', '--index', '--unidiff-zero', str(target))
          run('git', 'diff', '--cached', '--check')
          run('git', 'commit', '-m', 'feat: integrate reviewed native A2A ingress and execution approvals')
          main = 'cb71998c66dfaa53d76b80fb52273680b62414cf'
          run('git', 'cat-file', '-e', main + '^{commit}')
          merge = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', main], text=True)
          assert merge.returncode == 1, 'Unexpected merge result'
          conflicts = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          assert conflicts == {'.env.example', 'prisma/schema.prisma'}, conflicts
          expected = {
              '.env.example': 'a04e54e5ae907f6c8c8cdc771d8cfd9f84d188e2fd3f7bdca249a0428829de65',
              'prisma/schema.prisma': '9568a344a4adeee7b703cf95e124e92039b12318ea905d78fdf0bd06ca2a3a8b',
          }
          for name, digest in expected.items():
              path = root / name
              text = path.read_text()
              assert text.count('<<<<<<< HEAD\n') == 1
              assert text.count('=======\n') == 1
              assert text.count('>>>>>>> ' + main + '\n') == 1
              separator = '}\n' if name == 'prisma/schema.prisma' else '\n'
              text = text.replace('<<<<<<< HEAD\n', '').replace('=======\n', separator).replace('>>>>>>> ' + main + '\n', '')
              assert hashlib.sha256(text.encode()).hexdigest() == digest, name
              path.write_text(text)
          oauth = root / 'tests/integration/sandbox-mcp-oauth.test.ts'
          text = oauth.read_text()
          assert text.count('OAuthClientInformationFull') == 2
          text = text.replace('OAuthClientInformationFull', 'OAuthClientInformationMixed')
          assert hashlib.sha256(text.encode()).hexdigest() == '20978cb75a3cc48c39de5e3e4c0f363e0006520ea220e3c84ca08b8fbde723b5'
          oauth.write_text(text)
          for i in range(1, 6):
              (root / f'.a2a-merge-patch.{i}').unlink()
          for name in ['a2a-entry-source.yml', 'a2a-native-contracts.yml', 'a2a-merge-validation-source.yml', 'a2a-merge-apply.yml']:
              (root / '.github/workflows' / name).unlink()
          run('git', 'add', '--all')
          run('git', 'diff', '--cached', '--check')
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'd52071a79189ae1692051c25d0c81095be0b4893', tree
          run('git', 'commit', '-m', 'merge: preserve latest main and validated A2A entry approvals')
          PY
          git push origin HEAD:refs/heads/feat/a2a-console-onboarding
