name: ci

on:
  pull_request:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  connector-cross-platform:
    if: >-
      github.event_name != 'pull_request_target' &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release-please--branches--'))
    name: connector (${{ matrix.os }})
    env:
      DATABASE_URL: postgresql://mcp:mcp@127.0.0.1:5432/toolplane
      AUTH_SECRET: connector-test-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
      CONNECTOR_INSTALL_SMOKE: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Test connector portability
        run: pnpm vitest run tests/unit/connector-cli.test.ts tests/unit/connector-auth.test.ts tests/unit/connector-bootstrap-route.test.ts tests/unit/connector-setup-token.test.ts tests/unit/spawn-spec.test.ts tests/unit/agent-skill-tools.test.ts tests/unit/sandbox.test.ts tests/integration/connector-broker.test.ts

      - name: Test Docker runtime helpers
        if: matrix.os == 'ubuntu-latest'
        env:
          SANDBOX_DOCKER_SMOKE: 1
        run: pnpm vitest run tests/integration/sandbox-docker-timeout.live.test.ts tests/integration/deployment-config-volume.live.test.ts

  validate:
    if: >-
      github.event_name != 'pull_request_target' &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release-please--branches--'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: mcp
          POSTGRES_DB: toolplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp -d toolplane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mcp:mcp@127.0.0.1:5432/toolplane
      AUTH_SECRET: test-auth-secret
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
      NEXT_TELEMETRY_DISABLED: 1
      TOOLPLANE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Enable pgvector
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Push Prisma schema
        run: pnpm exec prisma db push

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Assemble and verify runtime artifact
        run: |
          pnpm runtime:assemble
          dist/release/app/node_modules/.bin/prisma validate
          node --check dist/release/app/node_modules/.toolplane-runtime/server.cjs
          test -L dist/release/app/packages
          test -L dist/release/app/messages
          tar -C dist/release -czf /tmp/toolplane-runtime-linux-amd64.tar.gz app
          tar -tzf /tmp/toolplane-runtime-linux-amd64.tar.gz app/public/ >/dev/null
          artifact_size=$(stat -c %s /tmp/toolplane-runtime-linux-amd64.tar.gz)
          test "$artifact_size" -le $((100 * 1024 * 1024))

  release-metadata:
    name: validate
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    steps:
      - name: Verify release metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          expected_files=$'.release-please-manifest.json\nCHANGELOG.md\npackage.json'
          actual_files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' | LC_ALL=C sort)"
          test "$actual_files" = "$expected_files"

  release-metadata-connectors:
    name: connector (${{ matrix.os }})
    needs: release-metadata
    if: ${{ needs.release-metadata.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Confirm release metadata gate
        run: echo "Release metadata verified; released commits already passed CI."
