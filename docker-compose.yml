services:
  postgres:
    image: postgres:16
    container_name: toolplane-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
      POSTGRES_DB: toolplane
    volumes:
      - mcp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcp -d toolplane']
      interval: 5s
      timeout: 5s
      retries: 10

  # Restricted Docker API proxy. The app launches one hardened container per
  # custom MCP. It never touches the raw socket directly — it talks to this
  # proxy over TCP, which only exposes the container/image/network endpoints needed.
  # The raw socket is mounted read-only into the proxy alone.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EXEC: 1
      POST: 1
      # everything else stays denied (no volumes/secrets/swarm/exec of host…)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # docker-source MCPs keep docker attach/wait calls open for as long as the
      # MCP server runs. The upstream proxy defaults to 10 minute HAProxy
      # timeouts, which makes those MCPs exit with "unexpected EOF".
      - ./infra/socket-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro

  # The app. Publish the HTTP port so an external proxy can route to this host.
  app:
    image: ${TOOLPLANE_IMAGE:-ghcr.io/asharca/toolplane:latest}
    platform: ${TOOLPLANE_PLATFORM:-linux/amd64}
    # Keep the archive lease owner stable across an app-container recreate so
    # PID/start-identity recovery can reclaim a crashed import immediately.
    hostname: toolplane-app
    volumes:
      # Raw Hermes archive uploads are streamed here before inspection. Keep
      # this source on a disk sized for the ZIP, extracted tree, and Docker
      # copy phase. Set TOOLPLANE_HERMES_ARCHIVE_VOLUME to an absolute host
      # path to use a dedicated bind mount instead of the named-volume default.
      - ${TOOLPLANE_HERMES_ARCHIVE_VOLUME:-toolplane_imports}:/var/lib/toolplane/imports
    expose:
      - '3000'
      - '9321'
      - '9332'
    ports:
      - '${APP_HOST_BIND:-0.0.0.0}:${APP_HOST_PORT:-10030}:3000'
      - '${CONNECTOR_WS_HOST_BIND:-0.0.0.0}:${CONNECTOR_WS_HOST_PORT:-9321}:9321'
      - '${HERMES_DASHBOARD_HOST_BIND:-0.0.0.0}:${HERMES_DASHBOARD_HOST_PORT:-9332}:9332'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/v1/health'',{signal:AbortSignal.timeout(4000)}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    environment:
      # Internal network → reach Postgres on 5432.
      DATABASE_URL: postgresql://mcp:mcp@postgres:5432/toolplane
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your environment or .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:10030}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@tp.rhzy.ai}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TOOLPLANE_PASSWORD_RESET_GLOBAL_LIMIT: ${TOOLPLANE_PASSWORD_RESET_GLOBAL_LIMIT:-200}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CONNECTOR_WS_BIND: 0.0.0.0
      CONNECTOR_WS_PORT: ${CONNECTOR_WS_PORT:-9321}
      CONNECTOR_WS_PUBLIC_URL: ${CONNECTOR_WS_PUBLIC_URL:-}
      HERMES_DASHBOARD_BIND: 0.0.0.0
      HERMES_DASHBOARD_PORT: ${HERMES_DASHBOARD_PORT:-9332}
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL:-}
      # Reach the Docker daemon through the restricted proxy, not the raw socket.
      DOCKER_HOST: tcp://socket-proxy:2375
      # Admin-only online updates download a GitHub Release runtime artifact,
      # replace /app in-place, and let Docker/Coolify restart this container.
      TOOLPLANE_IMAGE: ${TOOLPLANE_IMAGE:-ghcr.io/asharca/toolplane:latest}
      TOOLPLANE_UPDATE_ENABLED: ${TOOLPLANE_UPDATE_ENABLED:-true}
      TOOLPLANE_UPDATE_REPO: ${TOOLPLANE_UPDATE_REPO:-asharca/ToolPlane}
      TOOLPLANE_UPDATE_ARTIFACT: ${TOOLPLANE_UPDATE_ARTIFACT:-toolplane-runtime-linux-amd64.tar.gz}
      # Instance default for new/imported Hermes agent runtimes. Individual
      # agents may still choose a pinned image in the dashboard.
      TOOLPLANE_HERMES_IMAGE: ${TOOLPLANE_HERMES_IMAGE:-}
      TOOLPLANE_MAX_ATTACHMENT_BYTES: ${TOOLPLANE_MAX_ATTACHMENT_BYTES:-1000000000}
      TOOLPLANE_HERMES_ARCHIVE_TMP_DIR: /var/lib/toolplane/imports
      TOOLPLANE_HTTP_REQUEST_TIMEOUT_MS: ${TOOLPLANE_HTTP_REQUEST_TIMEOUT_MS:-14400000}
      # Git/PyPI/GitHub MCPs may need a quiet first install. Values are in ms;
      # admins can override them in Settings for subsequent MCP starts.
      TOOLPLANE_MCP_STARTUP_IDLE_TIMEOUT_MS: ${TOOLPLANE_MCP_STARTUP_IDLE_TIMEOUT_MS:-300000}
      TOOLPLANE_MCP_STARTUP_MAX_TIMEOUT_MS: ${TOOLPLANE_MCP_STARTUP_MAX_TIMEOUT_MS:-900000}
      TOOLPLANE_RUNTIME_ROOT: /app
      # These paths are baked into the Docker image. Local `pnpm dev` may still
      # override them through .env when running outside Compose.
      HERMES_ROOT: /opt/hermes-agent
      TOOLPLANE_HERMES_ROOT: /opt/hermes-agent
      TOOLPLANE_PYTHON: /opt/toolplane-hermes-venv/bin/python

volumes:
  mcp_pg:
  toolplane_imports:
