name: runtime-package-diagnostics
on:
  push:
    branches: [feat/a2a-console-onboarding]
    paths: [.github/workflows/runtime-package-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only the failed artifact verification step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 35872307672 --repo asharca/ToolPlane --job 107219263284 --log-failed
