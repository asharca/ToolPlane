name: ui-refine
on:
  push:
    branches: [refactor/beui-platform-ui]
    paths: [.github/workflows/ui-refine.yml]
permissions:
  contents: write
concurrency:
  group: ui-source-migration
  cancel-in-progress: false
jobs:
  refine:
    if: github.repository == 'asharca/ToolPlane' && github.ref == 'refs/heads/refactor/beui-platform-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://mcp:mcp@127.0.0.1:5432/toolplane_ui_test
      AUTH_SECRET: isolated-ui-test-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve module policy checks and readable JSX
        run: |
          cat > .ui-refine.mjs <<'JS'
          import ts from 'typescript';
          import {readFileSync,writeFileSync,unlinkSync,readdirSync} from 'node:fs';
          const edit=(file,fn)=>writeFileSync(file,fn(readFileSync(file,'utf8')));
          edit('tests/unit/beui-architecture.test.ts',s=>s.replace('pkg.dependencies["@/components/ui"]','pkg.dependencies["@asharca/ui"]').replace('node.moduleSpecifier.text.startsWith("@/components/ui")','node.moduleSpecifier.text.startsWith("@asharca/ui")').replace('const target = path.join(directory, entry.name);','const target = path.posix.join(directory, entry.name);'));
          edit('scripts/ui/migrate-beui.mjs',s=>s.replace('if (ts.isStringLiteral(node) && /^@asharca',"if (ts.isStringLiteral(node) && ((ts.isImportDeclaration(node.parent) || ts.isExportDeclaration(node.parent)) || (ts.isCallExpression(node.parent) && ['vi.mock', 'vi.doMock', 'vi.importActual', 'vi.importMock', 'import'].includes(node.parent.expression.getText(ast)))) && /^@asharca"));
          edit('tests/unit/beui-migration.test.ts',s=>s.replace("  it('is idempotent",`  it('does not rewrite policy checks or package names outside module specifiers', () => {
              const source = \`const name = '@asharca/ui'; expect(pkg.dependencies['@asharca/ui']).toBeUndefined();\`;
              expect(migrateSource(source, 'policy.test.ts')).toBe(source);
              expect(migrateSource(\`vi.mock('@asharca/ui');\`, 'mock.test.ts')).toContain(\`vi.mock("@/components/ui");\`);
            });
            it('is idempotent`));
          const factory=ts.factory;
          for(const name of ['ChatThread','WorkspaceTabBar']) {
            const file=`src/components/ui/compositions/${name}.js`;
            let input=readFileSync(file,'utf8');
            input=input.replace(/\(_a = composerInputRef\.current\) === null \|\| _a === void 0 \? void 0 : _a\.focus\(\);/g,'composerInputRef.current?.focus();').replace(/\(_b = \(_a = activeRef\.current\) === null \|\| _a === void 0 \? void 0 : _a\.scrollIntoView\) === null \|\| _b === void 0 \? void 0 : _b\.call\(_a, \{ block: 'nearest', inline: 'nearest' \}\);/,"activeRef.current?.scrollIntoView?.({block:'nearest',inline:'nearest'});");
            const ast=ts.createSourceFile(file,input,ts.ScriptTarget.Latest,true,ts.ScriptKind.JS);
            const result=ts.transform(ast,[context=>{
              const visit=node=>{
                if(ts.isImportDeclaration(node) && node.moduleSpecifier.text==='react/jsx-runtime') return undefined;
                if(ts.isCallExpression(node) && ['_jsx','_jsxs'].includes(node.expression.getText(ast))) {
                  const tag=node.arguments[0]; const tagName=ts.isStringLiteral(tag)?factory.createIdentifier(tag.text):tag;
                  const attrs=[]; let children=[];
                  const child=value=>{
                    if(ts.isArrayLiteralExpression(value)) return value.elements.flatMap(child);
                    const v=ts.visitNode(value,visit);
                    if(ts.isJsxElement(v)||ts.isJsxSelfClosingElement(v)) return [v];
                    return [factory.createJsxExpression(undefined,v)];
                  };
                  const props=p=>{
                    if(ts.isCallExpression(p)&&p.expression.getText(ast)==='Object.assign') { p.arguments.forEach(props); return; }
                    if(!ts.isObjectLiteralExpression(p)) {attrs.push(factory.createJsxSpreadAttribute(ts.visitNode(p,visit)));return;}
                    for(const prop of p.properties){
                      if(ts.isSpreadAssignment(prop)){attrs.push(factory.createJsxSpreadAttribute(ts.visitNode(prop.expression,visit)));continue;}
                      if(!ts.isPropertyAssignment(prop)) throw Error('Unexpected prop');
                      const key=ts.isStringLiteral(prop.name)?prop.name.text:prop.name.getText(ast);
                      if(key==='children'){children=child(prop.initializer);continue;}
                      attrs.push(factory.createJsxAttribute(factory.createIdentifier(key),factory.createJsxExpression(undefined,ts.visitNode(prop.initializer,visit))));
                    }
                  };
                  props(node.arguments[1]);
                  if(node.arguments[2])attrs.push(factory.createJsxAttribute(factory.createIdentifier('key'),factory.createJsxExpression(undefined,ts.visitNode(node.arguments[2],visit))));
                  if(!children.length)return factory.createJsxSelfClosingElement(tagName,undefined,factory.createJsxAttributes(attrs));
                  return factory.createJsxElement(factory.createJsxOpeningElement(tagName,undefined,factory.createJsxAttributes(attrs)),children,factory.createJsxClosingElement(tagName));
                }
                return ts.visitEachChild(node,visit,context);
              };
              return node=>ts.visitNode(node,visit);
            }]);
            let output=ts.createPrinter({newLine:ts.NewLineKind.LineFeed}).printFile(result.transformed[0]);
            output=output.replace('catch (_a) {','catch {').replace('const toggleComposer = () => {\n        var _a;','const toggleComposer = () => {').replace('        var _a, _b;\n','');
            writeFileSync(file.replace(/\.js$/,'.jsx'),output);unlinkSync(file);
          }
          for(const name of readdirSync('src/components/ui/compositions').filter(f=>/\.(jsx?|ts)$/.test(f)).map(f=>'src/components/ui/compositions/'+f).concat('src/components/ui/index.ts')){
            edit(name,s=>{for(const m of ['ChatThread','WorkspaceTabBar']) s=s.replaceAll(`/${m}.js`, `/${m}.jsx`);return s;});
          }
          const docs={
            'docs/DEPLOYMENT.md':[['共享 UI 使用 `asharca/ui` 发布的 `@asharca/ui` npm 包','共享 UI 使用 `asharca/ui` 的固定版本源码 registry']],
            'docs/DEPLOYMENT.en.md':[['Shared UI comes from the published `@asharca/ui` npm package maintained in `asharca/ui`','Shared UI uses pinned source-registry components maintained in `asharca/ui`']],
            'docs/README.zh-CN.md':[['`@asharca/ui` 更新与发布','源码 registry、组件适配与回归检查']],
            'docs/README.md':[['Updating and releasing `@asharca/ui`','Source registry, component adapters and regression checks']],
            'docs/ARCHITECTURE.md':[['Tailwind CSS、npm 发布的共享 UI 包 `@asharca/ui`','Tailwind CSS、beUI 固定版本源码组件与表单/无障碍适配层'],['共享 UI 源码在独立的 `asharca/ui` 仓库；ToolPlane 消费发布的 `@asharca/ui`，不要把 `packages/ui` 当作本仓库的维护入口。','共享 UI 源码来自独立的 `asharca/ui` 源码 registry；固定版本、来源与修改说明在 `src/components/ui/beui/provenance.json`，应用适配在 `src/components/ui`，不再依赖旧 npm 包。']],
            'docs/ARCHITECTURE.en.md':[['Tailwind CSS and the published `@asharca/ui` package','Tailwind CSS, pinned beUI source components and native-form/accessibility adapters'],['Shared UI source is in the separate `asharca/ui` repository. ToolPlane consumes released `@asharca/ui`; do not treat `packages/ui` as a maintained local source entry point.','Shared UI comes from the separate `asharca/ui` source registry. Provenance and adaptations are recorded in `src/components/ui/beui/provenance.json`; application adapters live in `src/components/ui` instead of the retired npm package.']]
          };
          for(const [file,replacements] of Object.entries(docs)) edit(file,s=>{for(const [from,to] of replacements){if(!s.includes(from))throw Error(`Missing documentation anchor ${file}`);s=s.replace(from,to);}return s;});
          JS
          node .ui-refine.mjs
          rm .ui-refine.mjs
          rm .github/workflows/ui-source-migration.yml .github/workflows/ui-refine.yml
      - name: Validate modified contracts before publishing
        run: |
          pnpm exec prisma generate
          pnpm exec tsc --noEmit
          pnpm exec eslint src/components/ui tests/unit/beui-* scripts/ui --max-warnings=0
          pnpm exec vitest run tests/unit/beui-native-contracts.test.tsx tests/unit/beui-migration.test.ts tests/unit/beui-architecture.test.ts tests/unit/agent-conversation.test.tsx tests/unit/workspace-assistant-chat.test.tsx tests/unit/dashboard-tabs.test.tsx
          git diff --check
      - name: Publish only the authorized source refinement
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/refactor/beui-platform-ui | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'asharca'
          git config user.email '129170100+asharca@users.noreply.github.com'
          git add src tests docs scripts/ui .github/workflows/ui-source-migration.yml .github/workflows/ui-refine.yml
          git commit -m 'refactor: finish beUI contracts and remove temporary migration workflows'
          git push origin HEAD:refs/heads/refactor/beui-platform-ui
