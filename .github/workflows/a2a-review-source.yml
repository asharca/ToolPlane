name: a2a-review-source
on:
  push:
    branches: [feat/a2a-console-onboarding]
    paths: [.github/workflows/a2a-review-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'asharca/ToolPlane'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/a2a-review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: a2a-review-source
          path: /tmp/a2a-review-source.tar.gz
          retention-days: 1
