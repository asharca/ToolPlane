packages:
  - .
  - packages/*

# 1.0.0 exposes a default-wrapper object that breaks the native MDX compiler.
overrides:
  style-to-js: 1.1.21

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  node-pty: true
  prisma: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
