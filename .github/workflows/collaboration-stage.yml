name: collaboration-stage

on:
  push:
    branches: ['feat/agent-collaboration-protocol']
    paths: ['.github/workflows/collaboration-stage.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'asharca/ToolPlane' && github.ref == 'refs/heads/feat/agent-collaboration-protocol'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply hash-verified feature changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'f831e8e3f056075829de70bf1534f79d5734be0f'
          archive="$RUNNER_TEMP/collaboration.patch.gz"
          patch="$RUNNER_TEMP/collaboration.patch"
          : > "$archive"
          for blob in \
            e5d06fe2bbe66b39f9cb557acefc844ff96cff74 \
            3e4491477cf6230843f980b7d683841798b3c3c5 \
            19137049efe691e4d1627ff6aa9873231ef76549 \
            d1f63b5517483cb6d57dce8e3e96e8c1381affeb \
            85b2b69e09d1782e96725eec9e761e376ec6b835 \
            506154df44188eac8e9e96a83373e5addd42b228 \
            15990c0a8e4c5532cf1adadc9fb5c86f56329ff3 \
            bea1b58aff3fac76bb1089f2d1abef6b9401d89f \
            b971a4f92669e2ab2c3352c87e2b109363adc5b8 \
            5d98c20e2a5b4f72e12443463a3992e44fda8fc5 \
            b974b00f0949e2d46a42dc70c123ec42f9bcfbb5 \
            bddc8c74ad44f0dd08f9e7d61532f600d30a0ad6; do
            gh api "repos/asharca/ToolPlane/git/blobs/$blob" --jq .content | base64 --decode >> "$archive"
          done
          echo "c2b5b84801fd572bbcfad08af91bf81e47f568334a3c2c702b1288c3be27c120  $archive" | sha256sum -c -
          gzip -dc "$archive" > "$patch"
          echo "6d99be59806db110b2a004a9457bc46e5d2b461c9d62f9ceb0f14333af3c56b6  $patch" | sha256sum -c -
          git apply --check "$patch"
          git apply --index --whitespace=error-all "$patch"
          rm .github/workflows/collaboration-stage.yml
          git add --all
          git diff --cached --check
          test "$(git write-tree)" = 'b957cfd5e8d645146af890fc769420011aeb5f8e'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add scoped durable Agent collaboration' -m 'Add task lifecycle, bounded delegation MCP tools, runtime grants, explicit Work authorization, a collaboration panel and bilingual documentation. Preserve managed Hermes and existing public endpoint boundaries.'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/agent-collaboration-protocol
