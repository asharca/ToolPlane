name: architecture-repair-snapshot

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  source-snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/architecture-130-137'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mcp:mcp@127.0.0.1:5432/toolplane
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD | gzip > /tmp/toolplane-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-repair-source
          path: /tmp/toolplane-source.tar.gz
          retention-days: 1
          if-no-files-found: error
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Archive installed verification dependencies only
        run: tar -czf /tmp/toolplane-verification-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-repair-dependencies
          path: /tmp/toolplane-verification-dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
