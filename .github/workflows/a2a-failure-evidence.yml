name: a2a-failure-evidence
on:
  push:
    branches: [feat/a2a-console-onboarding]
    paths: [.github/workflows/a2a-failure-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a972d74a3c36a553ca11e17f6822fb189a9303aa
          persist-credentials: false
      - name: Collect exact failed job evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a2a-failure-evidence
          gh api --allow-escape-sequences repos/asharca/ToolPlane/actions/jobs/107177974891/logs > /tmp/a2a-raw-job.log
          git rev-parse HEAD > /tmp/a2a-failure-evidence/revision.txt
          git ls-tree HEAD package.json tests/integration/a2a-local.test.ts tests/integration/messaging.test.ts tests/integration/agent-messaging.test.ts .github/workflows/ci.yml > /tmp/a2a-failure-evidence/source-objects.txt
          python3 - <<'PY'
          import pathlib,re,json
          raw=pathlib.Path('/tmp/a2a-raw-job.log').read_text()
          raw=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',raw)
          lines=raw.splitlines()
          keep=set()
          for i,line in enumerate(lines):
              if any(marker in line for marker in ['FAIL ', 'Failed Tests', 'AssertionError', 'PrismaClientKnownRequestError', 'Test Files', 'Tests  ', '> toolplane@', '> vitest', '> pnpm test', '::error', 'Process completed']):
                  keep.update(range(max(0,i-3),min(len(lines),i+22)))
          excerpt='\n'.join(lines[i] for i in sorted(keep))
          excerpt=re.sub(r'(?i)(bearer\s+)[^\s"\']+',r'\1[redacted]',excerpt)
          pathlib.Path('/tmp/a2a-failure-evidence/failed-job-excerpt.log').write_text(excerpt)
          pathlib.Path('/tmp/a2a-failure-evidence/scripts.json').write_text(json.dumps(json.loads(pathlib.Path('package.json').read_text())['scripts'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a2a-failure-evidence
          path: /tmp/a2a-failure-evidence/
          retention-days: 1
