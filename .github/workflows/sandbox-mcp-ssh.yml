name: sandbox-ssh
on:
  pull_request:
permissions:
  contents: read
jobs:
  ssh-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Worker and SSH argument regression tests
        run: |
          python3 -m unittest discover -s tests/sandbox-ssh -p 'test_ssh_worker.py' -v
          node --test tests/sandbox-ssh/ssh-adapter.test.mjs
      - name: Install ephemeral fixture dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y openssh-server
      - name: Real SSH protocol smoke test
        run: bash tests/sandbox-ssh/run-live.sh
