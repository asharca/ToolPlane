name: a2a-apply-local-reviewed
on:
  push:
    branches: [feat/a2a-native-core]
    paths: ['.a2a-local-reviewed.*', '.github/workflows/a2a-apply-local-reviewed.yml']
permissions:
  contents: write
concurrency:
  group: a2a-local-reviewed-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'asharca/ToolPlane' && github.ref == 'refs/heads/feat/a2a-native-core'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply exact reviewed local A2A source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          compressed = b''.join((root / f'.a2a-local-reviewed.{i}').read_bytes() for i in range(1, 7))
          assert hashlib.sha256(compressed).hexdigest() == '184c4e0e0387086378d1b7627afd2671b176bfb7cfaf012bb70b3b94cd906ffe'
          patch = lzma.decompress(compressed)
          assert len(patch) == 148332
          target = pathlib.Path('/tmp/a2a-local-reviewed.patch')
          target.write_bytes(patch)
          allowed = {'.github/workflows/a2a-source-snapshot.yml', 'docs/A2A_LOCAL_COLLABORATION.md', 'docs/A2A_LOCAL_COLLABORATION.zh-CN.md', 'docs/A2A_NATIVE.md', 'docs/A2A_NATIVE.zh-CN.md', 'docs/README.md', 'docs/README.zh-CN.md', 'prisma/migrations/20260922010000_a2a_local_collaboration/migration.sql', 'prisma/schema.prisma', 'src/app/api/v1/agent-runtime/a2a/[taskId]/mcp/route.ts', 'src/app/api/v1/workspaces/[slug]/agents/[agentId]/a2a/local/route.ts', 'src/lib/a2a/executor.ts', 'src/lib/a2a/handler.ts', 'src/lib/a2a/http.ts', 'src/lib/a2a/local-continuation.ts', 'src/lib/a2a/local-executor.ts', 'src/lib/a2a/local-http.ts', 'src/lib/a2a/local-mcp.ts', 'src/lib/a2a/local-policy.ts', 'src/lib/a2a/local-runtime.ts', 'src/lib/a2a/principal.ts', 'src/lib/a2a/store.ts', 'src/lib/a2a/transport-limits.ts', 'src/lib/a2a/worker.ts', 'src/lib/agents/runtime-access.ts', 'src/lib/agents/runtime-grant.ts', 'src/lib/agents/sandbox-execution-gate.ts', 'src/lib/agents/sandbox-runtime.ts', 'tests/integration/a2a-local.test.ts', 'tests/unit/a2a-architecture.test.ts', 'tests/unit/a2a-http.test.ts', 'tests/unit/a2a-local-executor.test.ts', 'tests/unit/a2a-local-http.test.ts', 'tests/unit/a2a-local-token.test.ts'}
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          paths = {line.split('\t', 2)[2] for line in stats.splitlines()}
          assert paths == allowed, paths ^ allowed
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          for i in range(1, 7):
              (root / f'.a2a-local-reviewed.{i}').unlink()
          (root / '.github/workflows/a2a-apply-local-reviewed.yml').unlink()
          subprocess.run(['git', 'add', '--all'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: unify local Agent delegation with native A2A tasks and durable continuations'
          git push origin HEAD:refs/heads/feat/a2a-native-core
