name: a2a-channel-fix
on:
  push:
    branches: [feat/a2a-console-onboarding]
    paths: ['.a2a-channel-fix.xz', '.github/workflows/a2a-channel-fix.yml']
permissions:
  contents: write
concurrency:
  group: a2a-reviewed-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply the reviewed channel regression fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib,subprocess
          compressed=pathlib.Path('.a2a-channel-fix.xz').read_bytes()
          assert hashlib.sha256(compressed).hexdigest()=='1dfb0919d2765bcd4d10963b850879a30320ec8287859530db6988e68085802f'
          patch=lzma.decompress(compressed)
          assert len(patch)==20479
          target=pathlib.Path('/tmp/a2a-channel-fix.patch'); target.write_bytes(patch)
          stats=subprocess.check_output(['git','apply','--numstat',str(target)],text=True)
          assert {line.split('\t',2)[2] for line in stats.splitlines()}=={'src/lib/agents/message-service.ts','tests/integration/agent-channels.test.ts'}
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          for name in ['.a2a-channel-fix.xz','.github/workflows/a2a-channel-fix.yml','.github/workflows/a2a-failure-evidence.yml']:
              pathlib.Path(name).unlink()
          subprocess.run(['git','add','--all'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='e996cfbda7d7bacc9b78f83d81ea84f6810f8031'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align channel regression coverage with authorized native A2A ingress'
          git push origin HEAD:refs/heads/feat/a2a-console-onboarding
