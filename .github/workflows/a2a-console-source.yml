name: a2a-console-source
on:
  push:
    branches: [feat/a2a-console-onboarding]
    paths: [.github/workflows/a2a-console-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=/tmp/a2a-console-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: a2a-console-source
          path: /tmp/a2a-console-source.tar.gz
          retention-days: 1
