name: ui-refactor-context
on:
  push:
    branches: [refactor/asharca-ui-platform]
    paths: [.github/workflows/ui-refactor-context.yml]
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e76b78059b42131a28766bd8c5e48be65ebc896a
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve only the new source components' runtime requirements
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));delete p.dependencies["@asharca/ui"];Object.assign(p.dependencies,{motion:"11.18.2",clsx:"2.1.1","tailwind-merge":"3.6.0",shiki:"3.23.0"});fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          pnpm install --no-frozen-lockfile
          pnpm exec prisma generate
      - name: Pack matching dependencies and lockfile
        run: |
          mkdir -p /tmp/ui-dev
          tar -czf /tmp/ui-dev/node_modules.tar.gz node_modules
          cp pnpm-lock.yaml package.json /tmp/ui-dev/
      - uses: actions/upload-artifact@v4
        with:
          name: beui-development-context
          path: /tmp/ui-dev/
          retention-days: 1
