name: collaboration-workbench
on:
  push:
    branches: [feat/agent-collaboration-protocol]
    paths: [.github/workflows/collaboration-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'asharca/ToolPlane' && github.ref == 'refs/heads/feat/agent-collaboration-protocol'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o "$RUNNER_TEMP/collaboration-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: collaboration-source
          path: ${{ runner.temp }}/collaboration-source.tar.gz
          retention-days: 2
