name: hermes-rpc-stage

on:
  push:
    branches: ['feat/hermes-rpc-runtime']
    paths: ['.github/workflows/hermes-rpc-stage.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'asharca/ToolPlane' && github.ref == 'refs/heads/feat/hermes-rpc-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Validate and apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = bfe7a8d95216d6697cfbaf29fe9686aee0840766
          test "$(git ls-remote origin refs/heads/feat/hermes-rpc-runtime | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, pathlib, re, subprocess
          data = b''.join(pathlib.Path(f'.hermes-rpc-stage/part-{n}.patch').read_bytes() for n in range(1, 9))
          assert hashlib.sha256(data).hexdigest() == 'dcdceccb03d8a0a47b3fb401a89a7cc05e9cd0978a4fe7cf84c797b332879bcb', 'Patch transport checksum mismatch'
          blocks = data.decode().split('diff --git ')[1:]
          assert len(blocks) == 44, len(blocks)
          targets = []
          for block in blocks:
              header = block.splitlines()[0]
              match = re.fullmatch(r'a/(.+) b/(.+)', header)
              assert match and match[1] == match[2]
              name = match[1]
              assert not name.startswith(('.', '/')) and '..' not in pathlib.PurePosixPath(name).parts
              assert name == 'README.md' or name.startswith(('docs/', 'messages/', 'prisma/', 'scripts/', 'src/', 'tests/'))
              index = re.search(r'^index ([a-f0-9]+)\.\.([a-f0-9]+)', block, re.M)
              assert index
              current = subprocess.run(['git', 'rev-parse', 'HEAD:' + name], capture_output=True, text=True)
              if set(index[1]) == {'0'}:
                  assert current.returncode != 0 and not pathlib.Path(name).exists(), name
              else:
                  assert current.returncode == 0 and current.stdout.strip().startswith(index[1]), name
              targets.append((name, index[2]))
          patch = pathlib.Path('/tmp/hermes-rpc-feature.patch')
          patch.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', str(patch)], check=True)
          for name, expected in targets:
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              assert actual.startswith(expected), name
          print(f'Applied and verified {len(targets)} source/document/test files.')
          PY
          git rm -r .hermes-rpc-stage
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add independent Hermes RPC sandbox runtime' -m 'Add native stdio execution, selected sandbox and resource bindings, isolated sessions, bounded cancellation, scoped proxy grants, regression tests and bilingual documentation.'
          git push origin HEAD:refs/heads/feat/hermes-rpc-runtime
