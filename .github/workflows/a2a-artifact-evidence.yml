name: a2a-artifact-evidence
on:
  push:
    branches: [feat/a2a-console-onboarding]
    paths: [.github/workflows/a2a-artifact-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 276dc50cc8e8c96773ddaa078bbcc1518e0c4085
          persist-credentials: false
      - name: Collect exact packaging failure without terminal control sequences
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a2a-artifact-evidence
          gh api --allow-escape-sequences repos/asharca/ToolPlane/actions/jobs/107189922485/logs > /tmp/a2a-raw-job.log
          git rev-parse HEAD > /tmp/a2a-artifact-evidence/revision.txt
          git ls-tree HEAD package.json scripts/assemble-runtime.mjs scripts/a2a-native-approval.mjs scripts/a2a-hermes-approval.py .github/workflows/ci.yml > /tmp/a2a-artifact-evidence/source-objects.txt
          python3 - <<'PY'
          import pathlib,re
          raw=pathlib.Path('/tmp/a2a-raw-job.log').read_text()
          raw=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',raw)
          lines=raw.splitlines()
          keep=set(range(max(0,len(lines)-260),len(lines)))
          for i,line in enumerate(lines):
              if any(marker in line for marker in ['FAIL ', 'Failed Tests', 'Test Files', 'Tests  ', 'Error:', '::error', 'runtime:assemble', 'Assembled runtime', 'above the']):
                  keep.update(range(max(0,i-2),min(len(lines),i+24)))
          excerpt='\n'.join(lines[i] for i in sorted(keep))
          excerpt=re.sub(r'(?i)(bearer\s+)[^\s"\']+',r'\1[redacted]',excerpt)
          pathlib.Path('/tmp/a2a-artifact-evidence/failure.log').write_text(excerpt)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a2a-artifact-evidence
          path: /tmp/a2a-artifact-evidence/
          retention-days: 1
