name: a2a-native-contracts
on:
  push:
    branches: [feat/a2a-console-onboarding]
    paths: [.github/workflows/a2a-native-contracts.yml]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect pinned public upstream source without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a2a-contracts
          fetch_source() {
            local name="$1" repo="$2" sha="$3"
            mkdir -p "/tmp/a2a-contracts/$name"
            git -C "/tmp/a2a-contracts/$name" init -q
            git -C "/tmp/a2a-contracts/$name" fetch --depth=1 "https://github.com/$repo" "$sha"
            git -C "/tmp/a2a-contracts/$name" checkout -q FETCH_HEAD
            git -C "/tmp/a2a-contracts/$name" rev-parse HEAD > "/tmp/a2a-contracts/$name.revision"
            rm -rf "/tmp/a2a-contracts/$name/.git"
          }
          fetch_source dsh deepseek-ai/deepseek-harness b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          fetch_source hermes NousResearch/hermes-agent 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
          curl --fail --location --proto '=https' --tlsv1.2 'https://registry.npmjs.org/@earendil-works/pi-coding-agent/-/pi-coding-agent-0.80.3.tgz' -o /tmp/a2a-contracts/pi-0.80.3.tgz
          tar -C /tmp -czf /tmp/a2a-native-contracts.tar.gz a2a-contracts
      - uses: actions/upload-artifact@v4
        with:
          name: a2a-native-contracts
          path: /tmp/a2a-native-contracts.tar.gz
          retention-days: 1
