name: a2a-console-apply
on:
  push:
    branches: [feat/a2a-console-onboarding]
    paths: ['.a2a-console-reviewed.*', '.github/workflows/a2a-console-apply.yml']
permissions:
  contents: write
concurrency:
  group: a2a-console-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'asharca/ToolPlane' && github.ref == 'refs/heads/feat/a2a-console-onboarding'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply checksum-verified console source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          compressed = b''.join((root / f'.a2a-console-reviewed.{i}').read_bytes() for i in range(1, 7))
          assert hashlib.sha256(compressed).hexdigest() == '9b77cccc8378fd56136ee2a864a5de8ba77b13a0ab3596401d7741c99cff7620'
          patch = lzma.decompress(compressed)
          assert len(patch) == 99926
          target = pathlib.Path('/tmp/a2a-console-reviewed.patch')
          target.write_bytes(patch)
          allowed = {'.github/workflows/a2a-console-source.yml', 'docs/A2A_CONSOLE.md', 'docs/A2A_CONSOLE.zh-CN.md', 'docs/A2A_LOCAL_COLLABORATION.md', 'docs/A2A_LOCAL_COLLABORATION.zh-CN.md', 'docs/A2A_NATIVE.md', 'docs/A2A_NATIVE.zh-CN.md', 'docs/README.md', 'docs/README.zh-CN.md', 'messages/en.json', 'messages/zh.json', 'src/app/api/v1/workspaces/[slug]/agents/[agentId]/a2a/console/route.ts', 'src/app/api/v1/workspaces/[slug]/agents/[agentId]/a2a/console/rpc/route.ts', 'src/app/app/[workspace]/agents/[agentId]/page.tsx', 'src/components/dashboard/agents/AgentA2APanel.tsx', 'src/components/dashboard/agents/AgentSettings.tsx', 'src/lib/a2a/connection-info.ts', 'src/lib/a2a/console-http.ts', 'src/lib/a2a/console-service.ts', 'tests/integration/a2a-console.test.ts', 'tests/unit/a2a-connection-info.test.ts', 'tests/unit/a2a-console-http.test.ts', 'tests/unit/agent-a2a-panel.test.tsx', 'tests/unit/agent-settings.test.tsx'}
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          paths = {line.split('\t', 2)[2] for line in stats.splitlines()}
          assert paths == allowed, paths ^ allowed
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          for i in range(1, 7):
              (root / f'.a2a-console-reviewed.{i}').unlink()
          (root / '.github/workflows/a2a-console-apply.yml').unlink()
          subprocess.run(['git', 'add', '--all'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add A2A console onboarding, scoped credentials and native task playground'
          git push origin HEAD:refs/heads/feat/a2a-console-onboarding
