name: ui-source-migration
on:
  push:
    branches: [refactor/beui-platform-ui]
    paths: [.github/workflows/ui-source-migration.yml]
permissions:
  contents: write
concurrency:
  group: ui-source-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'asharca/ToolPlane' && github.ref == 'refs/heads/refactor/beui-platform-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://mcp:mcp@127.0.0.1:5432/toolplane
      AUTH_SECRET: isolated-ui-test-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply fixed source-registry migration
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'scripts/ui/migrate-beui.mjs';
          let source = readFileSync(file, 'utf8');
          source = source.replace("import { createRequire } from 'node:module';\n", '');
          source = source.replace('  const require = createRequire(import.meta.url);\n', '');
          source = source.replace("path.dirname(path.dirname(require.resolve('@asharca/ui')))", "path.dirname(path.dirname(fileURLToPath(import.meta.resolve('@asharca/ui'))))");
          writeFileSync(file, source);
          JS
          node scripts/ui/migrate-beui.mjs
          pnpm remove @asharca/ui
          pnpm add --save-exact motion@11.18.2 clsx@2.1.1 tailwind-merge@3.6.0
          pnpm exec prisma generate
          git diff --check
      - name: Commit source changes only to the authorized branch
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/refactor/beui-platform-ui | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'asharca'
          git config user.email '129170100+asharca@users.noreply.github.com'
          git add src tests docs scripts/ui AGENTS.md package.json pnpm-lock.yaml vitest.config.ts eslint.config.mjs
          git diff --cached --stat
          git commit -m 'refactor: migrate platform controls to pinned beUI source registry'
          git push origin HEAD:refs/heads/refactor/beui-platform-ui
          git rev-parse HEAD
      - name: Typecheck generated source
        run: pnpm exec tsc --noEmit
      - name: New UI behavior contracts
        if: always()
        run: pnpm exec vitest run tests/unit/beui-native-contracts.test.tsx tests/unit/beui-migration.test.ts tests/unit/beui-architecture.test.ts
      - name: Prepare isolated source and dependency review context
        if: always()
        run: |
          mkdir -p /tmp/beui-context
          git rev-parse HEAD > /tmp/beui-context/commit.txt
          tar --exclude=./.git --exclude=./.env --exclude=./.env.local --exclude=./.next --exclude=./dist --exclude=./.playwright-cli --exclude=./.remember -czf /tmp/beui-context/source.tgz .
          cp "$(command -v node)" /tmp/beui-context/node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beui-development-context
          path: /tmp/beui-context/
          retention-days: 1
