name: a2a-workbench-apply
on:
  push:
    branches: [feat/a2a-console-onboarding]
    paths: ['.a2a-workbench.*', '.github/workflows/a2a-workbench-apply.yml']
permissions:
  contents: write
concurrency:
  group: a2a-workbench-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'asharca/ToolPlane' && github.ref == 'refs/heads/feat/a2a-console-onboarding'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply exact verified native workbench source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          compressed = b''.join((root / f'.a2a-workbench.{i}').read_bytes() for i in range(1, 5))
          assert len(compressed) == 23596
          assert hashlib.sha256(compressed).hexdigest() == '88ae9b5f6930a9983d796947ebfc0b6cacf4852c14d5145ffb1a4b9e0e8e3de0'
          patch = lzma.decompress(compressed)
          assert len(patch) == 87812
          target = pathlib.Path('/tmp/a2a-workbench.patch')
          target.write_bytes(patch)
          allowed = {'.github/workflows/a2a-workbench-source.yml', 'docs/A2A_CONSOLE.md', 'docs/A2A_CONSOLE.zh-CN.md', 'docs/A2A_WORKBENCH.md', 'docs/A2A_WORKBENCH.zh-CN.md', 'docs/README.md', 'docs/README.zh-CN.md', 'messages/en.json', 'messages/zh.json', 'src/app/app/[workspace]/work/page.tsx', 'src/components/dashboard/agents/AgentA2APanel.tsx', 'src/components/dashboard/agents/AgentA2ATaskMonitor.tsx', 'src/components/dashboard/work/A2AWorkbench.tsx', 'src/components/dashboard/work/WorkspaceWork.tsx', 'src/lib/a2a/console-http.ts', 'src/lib/a2a/console-tasks.ts', 'src/lib/a2a/workbench-client.ts', 'src/lib/a2a/workbench.ts', 'tests/integration/a2a-local.test.ts', 'tests/unit/a2a-console-http.test.ts', 'tests/unit/a2a-workbench-client.test.ts', 'tests/unit/a2a-workbench.test.tsx', 'tests/unit/agent-a2a-task-monitor.test.tsx', 'tests/unit/workspace-work-page.test.tsx'}
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          paths = {line.split('\t', 2)[2] for line in stats.splitlines()}
          assert paths == allowed, paths ^ allowed
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          for i in range(1, 5):
              (root / f'.a2a-workbench.{i}').unlink()
          (root / '.github/workflows/a2a-workbench-apply.yml').unlink()
          subprocess.run(['git', 'add', '--all'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'e4b65c5b6cbce8c6378724ce524aaa38ef8f3bb3', tree
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add native A2A workbench with durable task follow-up and safe recovery'
          test "$(git ls-remote origin refs/heads/feat/a2a-console-onboarding | cut -f1)" = '${{ github.sha }}'
          git push origin HEAD:refs/heads/feat/a2a-console-onboarding
