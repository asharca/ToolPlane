name: a2a-apply-reviewed-patch
on:
  push:
    branches: [feat/a2a-native-core]
    paths: ['.a2a-reviewed.*', '.github/workflows/a2a-apply-reviewed-patch.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: a2a-reviewed-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'asharca/ToolPlane' && github.ref == 'refs/heads/feat/a2a-native-core'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: a2a-development-context
          run-id: 35691539954
          github-token: ${{ github.token }}
          path: /tmp/a2a-native-context
      - name: Apply reviewed source and the exact locally tested dependency lock
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          compressed = b''.join((root / f'.a2a-reviewed.{i}').read_bytes() for i in range(1, 7))
          assert hashlib.sha256(compressed).hexdigest() == '16e54b3a3ac2588fd5e46837e061bf00a269d88e117b81bc909518a91ec268f6'
          patch = lzma.decompress(compressed)
          assert len(patch) == 131710
          target = pathlib.Path('/tmp/a2a-reviewed.patch')
          target.write_bytes(patch)
          allowed = {'docs/README.md', 'docs/README.zh-CN.md', 'prisma/schema.prisma', 'src/instrumentation.node.ts', 'src/lib/agents/public-api/maintenance.ts', 'src/lib/agents/public-api/runs.ts', 'src/lib/runtime/owner.ts', 'tests/unit/instrumentation.test.ts', 'docs/A2A_NATIVE.md', 'docs/A2A_NATIVE.zh-CN.md', 'prisma/migrations/20260922000000_a2a_native_tasks/migration.sql', 'src/app/api/v1/agent-endpoints/[endpointId]/a2a/.well-known/agent-card.json/route.ts', 'src/app/api/v1/agent-endpoints/[endpointId]/a2a/route.ts', 'src/app/api/v1/workspaces/[slug]/agents/[agentId]/a2a/route.ts', 'src/lib/a2a/executor.ts', 'src/lib/a2a/handler.ts', 'src/lib/a2a/http.ts', 'src/lib/a2a/management.ts', 'src/lib/a2a/model.ts', 'src/lib/a2a/principal.ts', 'src/lib/a2a/store.ts', 'src/lib/a2a/transport-limits.ts', 'src/lib/a2a/validation.ts', 'src/lib/a2a/worker.ts', 'tests/integration/a2a-native.test.ts', 'tests/unit/a2a-architecture.test.ts', 'tests/unit/a2a-http.test.ts', 'tests/unit/a2a-management.test.ts', 'tests/unit/a2a-protocol.test.ts'}
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          paths = {line.split('\t', 2)[2] for line in stats.splitlines()}
          assert paths == allowed, paths ^ allowed
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          expected = {'package.json': '50f3f63530a9f3a0f55067ba5d21872e89871332d81b346de813491015f74e3f', 'pnpm-lock.yaml': '3d84c980e8580d171347afec06f4a323f9cbd778df0f274d6cc4ca93d5bf272a'}
          with tarfile.open('/tmp/a2a-native-context/a2a-context.tar.gz', 'r:gz') as archive:
              for name, digest in expected.items():
                  member = archive.getmember('./' + name)
                  assert member.isfile() and member.size < 2000000
                  data = archive.extractfile(member).read()
                  assert hashlib.sha256(data).hexdigest() == digest
                  (root / name).write_bytes(data)
          migration = root / 'prisma/migrations/20260922000000_a2a_native_tasks/migration.sql'
          migration.write_bytes(migration.read_bytes().rstrip(b'\r\n') + b'\n')
          for i in range(1, 7):
              (root / f'.a2a-reviewed.{i}').unlink()
          for name in ['a2a-development-context.yml', 'a2a-apply-reviewed-patch.yml']:
              (root / '.github/workflows' / name).unlink()
          subprocess.run(['git', 'add', '--all'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement native A2A 1.0 tasks and durable isolated execution'
          git push origin HEAD:refs/heads/feat/a2a-native-core
